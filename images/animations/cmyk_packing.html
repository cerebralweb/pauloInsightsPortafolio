<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tray Packing — CMYK</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<style>
  :root{
    --cyan:#00AEEF;
    --magenta:#EC008C;
    --yellow:#FFDD00;
    --key:#1A1A1A;
    --paper:#F3F1EA;
    --ink:#141414;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    background:var(--paper);
    color:var(--ink);
    font-family:"Helvetica Neue",Arial,sans-serif;
    -webkit-font-smoothing:antialiased;
    overflow:hidden;
  }
  #frame{
    position:fixed;inset:0;
    display:grid;
    grid-template-rows:auto 1fr auto;
    padding:26px;
  }
  /* registration marks */
  .reg{position:fixed;width:34px;height:34px;pointer-events:none;opacity:.85}
  .reg::before,.reg::after{content:"";position:absolute;background:var(--key)}
  .reg::before{left:16px;top:0;width:1px;height:34px}
  .reg::after{top:16px;left:0;height:1px;width:34px}
  .reg .ring{position:absolute;left:9px;top:9px;width:16px;height:16px;border:1px solid var(--key);border-radius:50%}
  #r1{left:10px;top:10px}#r2{right:10px;top:10px}#r3{left:10px;bottom:10px}#r4{right:10px;bottom:10px}

  header{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;padding:0 22px}
  .eyebrow{
    font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
    font-size:11px;letter-spacing:.32em;text-transform:uppercase;
    color:#6b6b6b;
  }
  h1{
    font-size:clamp(26px,4.6vw,52px);
    font-weight:800;letter-spacing:-.02em;line-height:.94;
    text-transform:uppercase;
  }
  h1 .c{color:var(--cyan)}h1 .m{color:var(--magenta)}h1 .y{color:#E8C400}
  .plate{
    font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
    font-size:11px;letter-spacing:.12em;color:#6b6b6b;text-align:right;line-height:1.7;
  }

  main{position:relative;margin:14px 0}
  #canvas-wrap{position:absolute;inset:0}
  canvas{display:block;width:100%;height:100%;cursor:grab}
  canvas:active{cursor:grabbing}

  /* big count readout, the key */
  #count{
    position:absolute;left:22px;bottom:14px;pointer-events:none;
    font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  }
  #count .n{font-size:clamp(48px,10vw,120px);font-weight:800;letter-spacing:-.04em;line-height:.8;color:var(--key)}
  #count .eq{font-size:12px;letter-spacing:.16em;color:#6b6b6b;margin-bottom:8px}
  #count .eq b.c{color:var(--cyan)}#count .eq b.m{color:var(--magenta)}#count .eq b.y{color:#C9A800}
  #count .unit{font-size:11px;letter-spacing:.14em;color:#6b6b6b;margin-top:10px}

  /* controls */
  #panel{
    position:absolute;right:22px;top:0;width:min(280px,40vw);
    background:rgba(243,241,234,.72);
    backdrop-filter:blur(6px);
    border:1px solid rgba(20,20,20,.14);
    padding:18px 18px 16px;
  }
  .ctl{margin-bottom:16px}
  .ctl:last-of-type{margin-bottom:8px}
  .ctl .row{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:7px}
  .ctl label{font-size:11px;letter-spacing:.18em;text-transform:uppercase;font-weight:700}
  .ctl .val{font-family:ui-monospace,"SF Mono",Menlo,monospace;font-size:12px;color:#4a4a4a}
  input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:3px;background:rgba(20,20,20,.2);outline:none}
  input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:16px;height:16px;border-radius:50%;border:2px solid var(--paper);cursor:pointer}
  input[type=range]::-moz-range-thumb{width:16px;height:16px;border-radius:50%;border:2px solid var(--paper);cursor:pointer}
  #sx::-webkit-slider-thumb{background:var(--cyan)}#sx::-moz-range-thumb{background:var(--cyan)}
  #sy::-webkit-slider-thumb{background:var(--magenta)}#sy::-moz-range-thumb{background:var(--magenta)}
  #sz::-webkit-slider-thumb{background:#E8C400}#sz::-moz-range-thumb{background:#E8C400}
  .btns{display:flex;gap:8px;margin-top:4px}
  button{
    flex:1;font-family:ui-monospace,"SF Mono",Menlo,monospace;
    font-size:10px;letter-spacing:.14em;text-transform:uppercase;
    padding:9px 6px;border:1px solid var(--key);background:transparent;color:var(--key);cursor:pointer;
    transition:background .15s,color .15s;
  }
  button:hover{background:var(--key);color:var(--paper)}
  .hint{font-family:ui-monospace,monospace;font-size:10px;letter-spacing:.1em;color:#8a8a8a;margin-top:12px;line-height:1.6}

  /* color bar foot */
  footer{display:flex;align-items:center;gap:0;padding:0 22px}
  .bar{display:flex;height:14px;flex:1;border:1px solid rgba(20,20,20,.25)}
  .bar span{flex:1}
  .foot-label{font-family:ui-monospace,monospace;font-size:10px;letter-spacing:.24em;color:#6b6b6b;padding-left:16px;white-space:nowrap}

  @media(max-width:720px){
    #panel{position:static;width:100%;margin-top:8px}
    main{margin:10px 0}
    header{flex-direction:column;align-items:flex-start;gap:6px}
    .plate{text-align:left}
    #count{left:14px;bottom:8px}
    #frame{padding:18px}
  }
  @media(prefers-reduced-motion:reduce){*{scroll-behavior:auto}}
</style>
</head>
<body>
<div class="reg" id="r1"><div class="ring"></div></div>
<div class="reg" id="r2"><div class="ring"></div></div>
<div class="reg" id="r3"><div class="ring"></div></div>
<div class="reg" id="r4"><div class="ring"></div></div>

<div id="frame">
  <header>
    <div>
      <div class="eyebrow">Volume Packing / Process Separation</div>
      <h1>Tray of <span class="c">Cyan</span> <span class="m">Magenta</span> <span class="y">Yellow</span> Blocks</h1>
    </div>
    <div class="plate">
      BLOCK 0.5 in<br>
      TRAY 12 &times; 4.5 &times; 3.5 in<br>
      MAX 1512 blocks
    </div>
  </header>

  <main>
    <div id="canvas-wrap"></div>

    <div id="count">
      <div class="eq"><b class="c">24</b> &times; <b class="m">9</b> &times; <b class="y">7</b></div>
      <div class="n">1512</div>
      <div class="unit">blocks in tray</div>
    </div>

    <div id="panel">
      <div class="ctl">
        <div class="row"><label style="color:var(--cyan)">Length</label><span class="val" id="vx">24 / 12.0 in</span></div>
        <input type="range" id="sx" min="1" max="24" value="24">
      </div>
      <div class="ctl">
        <div class="row"><label style="color:var(--magenta)">Width</label><span class="val" id="vy">9 / 4.5 in</span></div>
        <input type="range" id="sy" min="1" max="9" value="9">
      </div>
      <div class="ctl">
        <div class="row"><label style="color:#C9A800">Height</label><span class="val" id="vz">7 / 3.5 in</span></div>
        <input type="range" id="sz" min="1" max="7" value="7">
      </div>
      <div class="btns">
        <button id="fill">Fill tray</button>
        <button id="unit">One layer</button>
      </div>
      <div class="hint">Drag the tray to turn it. Each slider divides one tray edge by the 0.5 in block.</div>
    </div>
  </main>

  <footer>
    <div class="bar">
      <span style="background:var(--cyan)"></span>
      <span style="background:var(--magenta)"></span>
      <span style="background:var(--yellow)"></span>
      <span style="background:var(--key)"></span>
    </div>
    <div class="foot-label">C M Y K</div>
  </footer>
</div>

<script>
const wrap = document.getElementById('canvas-wrap');
const scene = new THREE.Scene();
const paper = 0xF3F1EA;
scene.background = new THREE.Color(paper);

const camera = new THREE.PerspectiveCamera(42, 1, 0.1, 1000);
const renderer = new THREE.WebGLRenderer({antialias:true});
renderer.setPixelRatio(Math.min(window.devicePixelRatio,2));
wrap.appendChild(renderer.domElement);

// lights
scene.add(new THREE.AmbientLight(0xffffff,0.72));
const key = new THREE.DirectionalLight(0xffffff,0.85);
key.position.set(6,10,8); scene.add(key);
const fill = new THREE.DirectionalLight(0xffffff,0.3);
fill.position.set(-8,-4,-6); scene.add(fill);

// ink colors, one per axis parity band
const CY = new THREE.Color(0x00AEEF);
const MA = new THREE.Color(0xEC008C);
const YE = new THREE.Color(0xFFDD00);
const inks = [CY, MA, YE];

const MAXX=24, MAXY=9, MAXZ=7;
const total = MAXX*MAXY*MAXZ;
const gap = 0.12;          // spacing so cubes read individually
const size = 1 - gap;

const geo = new THREE.BoxGeometry(size,size,size);
const mat = new THREE.MeshStandardMaterial({roughness:0.55,metalness:0.05,vertexColors:false});
const mesh = new THREE.InstancedMesh(geo, mat, total);
mesh.instanceColor = new THREE.InstancedBufferAttribute(new Float32Array(total*3),3);

// thin key outline for each cube
const edgeGeo = new THREE.EdgesGeometry(geo);
const edgeMat = new THREE.LineBasicMaterial({color:0x141414,transparent:true,opacity:0.28});
const edges = new THREE.LineSegments(new THREE.BufferGeometry(), edgeMat); // rebuilt via group

const group = new THREE.Group();
group.add(mesh);
scene.add(group);

const dummy = new THREE.Object3D();
const col = new THREE.Color();

let nx=MAXX, ny=MAXY, nz=MAXZ;

function layout(){
  const cx=(nx-1)/2, cy=(ny-1)/2, cz=(nz-1)/2;
  let i=0;
  for(let x=0;x<nx;x++){
    for(let y=0;y<ny;y++){
      for(let z=0;z<nz;z++){
        dummy.position.set(x-cx, y-cy, z-cz);
        dummy.updateMatrix();
        mesh.setMatrixAt(i, dummy.matrix);
        const band = (x+y+z)%3;               // C M Y checker through the volume
        col.copy(inks[band]);
        mesh.setColorAt(i, col);
        i++;
      }
    }
  }
  mesh.count = nx*ny*nz;
  mesh.instanceMatrix.needsUpdate = true;
  if(mesh.instanceColor) mesh.instanceColor.needsUpdate = true;
  fitCamera();
  updateReadout();
}

function fitCamera(){
  const spanX=MAXX, spanY=MAXY, spanZ=MAXZ;
  const r = Math.sqrt(spanX*spanX+spanY*spanY+spanZ*spanZ)/2;
  camDist = r/Math.sin((camera.fov*Math.PI/180)/2)*0.62;
}
let camDist=30;

// readout
const vx=document.getElementById('vx'), vy=document.getElementById('vy'), vz=document.getElementById('vz');
const countN=document.querySelector('#count .n');
const eq=document.querySelector('#count .eq');
function fmt(n){return n.toLocaleString('en-US');}
function updateReadout(){
  vx.textContent = nx+' / '+(nx*0.5).toFixed(1)+' in';
  vy.textContent = ny+' / '+(ny*0.5).toFixed(1)+' in';
  vz.textContent = nz+' / '+(nz*0.5).toFixed(1)+' in';
  countN.textContent = fmt(nx*ny*nz);
  eq.innerHTML = '<b class="c">'+nx+'</b> &times; <b class="m">'+ny+'</b> &times; <b class="y">'+nz+'</b>';
}

// sliders
const sx=document.getElementById('sx'), sy=document.getElementById('sy'), sz=document.getElementById('sz');
sx.addEventListener('input',()=>{nx=+sx.value;layout();});
sy.addEventListener('input',()=>{ny=+sy.value;layout();});
sz.addEventListener('input',()=>{nz=+sz.value;layout();});
document.getElementById('fill').addEventListener('click',()=>{
  nx=MAXX;ny=MAXY;nz=MAXZ;sx.value=nx;sy.value=ny;sz.value=nz;layout();
});
document.getElementById('unit').addEventListener('click',()=>{
  nx=MAXX;ny=MAXY;nz=1;sx.value=nx;sy.value=ny;sz.value=nz;layout();
});

// drag to rotate
let rotY=0.7, rotX=0.42, auto=true, dragging=false, px=0, py=0;
renderer.domElement.addEventListener('pointerdown',e=>{dragging=true;auto=false;px=e.clientX;py=e.clientY;});
window.addEventListener('pointerup',()=>dragging=false);
window.addEventListener('pointermove',e=>{
  if(!dragging)return;
  rotY += (e.clientX-px)*0.008;
  rotX += (e.clientY-py)*0.008;
  rotX = Math.max(-1.3,Math.min(1.3,rotX));
  px=e.clientX;py=e.clientY;
});

const reduce = window.matchMedia('(prefers-reduced-motion:reduce)').matches;

function resize(){
  const w=wrap.clientWidth, h=wrap.clientHeight;
  renderer.setSize(w,h,false);
  camera.aspect=w/h; camera.updateProjectionMatrix();
}
window.addEventListener('resize',resize);

function tick(){
  requestAnimationFrame(tick);
  if(auto && !reduce) rotY += 0.0032;
  group.rotation.y = rotY;
  group.rotation.x = rotX;
  camera.position.set(0,0,camDist);
  camera.lookAt(0,0,0);
  renderer.render(scene,camera);
}

layout();
resize();
tick();
</script>
</body>
</html>
